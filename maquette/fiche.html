<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche adhérent – CIOFF France</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/front.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="annuaire">
<div data-entete></div>
<main class="large" style="padding-bottom:4rem" id="fiche"></main>
<div data-pied></div>
<script src="assets/adherents.js"></script>
<script src="assets/data.js"></script>
<script src="assets/layout.js"></script>
<script>
( function () {
	function e( s ) { var d = document.createElement( 'div' ); d.textContent = s == null ? '' : s; return d.innerHTML; }
	var id = parseInt( new URLSearchParams( location.search ).get( 'id' ), 10 ) || 1;
	var a = CIOFF.adherents.filter( function ( x ) { return x.id === id; } )[0] || CIOFF.adherents[0];
	var t = CIOFF.types[ a.type ];
	document.title = a.nom + ' – CIOFF France';

	var paragraphes = ( a.description || '' ).split( /\n\s*\n/ ).map( function ( p ) { return '<p>' + e( p ) + '</p>'; } ).join( '' );
	var lieu = [ a.ville, a.deptNom ? a.deptNom + ' (' + a.dept + ')' : '', a.region ].filter( Boolean ).join( ' · ' );
	var contact = [];
	if ( a.email ) { contact.push( '<li><a href="mailto:' + e( a.email ) + '">' + e( a.email ) + '</a></li>' ); }
	if ( a.site ) { contact.push( '<li><a href="' + e( a.site ) + '" target="_blank" rel="noopener">' + e( a.site.replace( /^https?:\/\/(www\.)?/, '' ).replace( /\/$/, '' ) ) + '</a></li>' ); }
	var u = encodeURIComponent( location.href ), ti = encodeURIComponent( a.nom );

	document.getElementById( 'fiche' ).innerHTML =
		'<div class="couverture" style="background:linear-gradient(135deg,' + t.couleur + ',#14264a)">Photo principale (à ajouter par l’adhérent)</div>' +
		'<h1 style="margin-top:1.5rem">' + e( a.nom ) + '</h1>' +
		'<div class="cioff-fiche">' +
		'<p class="cioff-fiche__meta">' + CIOFF.badge( a.type ) + ' <span class="cioff-fiche__lieu">' + e( lieu ) + '</span></p>' +
		'<div class="cioff-fiche__grille"><div class="cioff-fiche__principal">' +
		'<div class="cioff-fiche__description">' + paragraphes + '</div>' +
		( a.dates ? '<section class="cioff-fiche__bloc"><h2>Prochaine édition</h2><p>' + e( a.dates ) + '</p></section>' : '' ) +
		'</div><aside class="cioff-fiche__cote">' +
		( contact.length ? '<div class="cioff-fiche__contact"><h2>Contact</h2><ul>' + contact.join( '' ) + '</ul></div>' : '' ) +
		( a.lat !== null ? '<div class="cioff-minicarte" id="minicarte" role="img" aria-label="Localisation sur la carte"></div>' : '' ) +
		'<div class="cioff-partage"><h2>Partager</h2><ul>' +
			'<li><a href="https://www.facebook.com/sharer/sharer.php?u=' + u + '" target="_blank" rel="noopener">Facebook</a></li>' +
			'<li><a href="https://wa.me/?text=' + ti + '%20' + u + '" target="_blank" rel="noopener">WhatsApp</a></li>' +
			'<li><a href="https://www.linkedin.com/sharing/share-offsite/?url=' + u + '" target="_blank" rel="noopener">LinkedIn</a></li>' +
			'<li><a href="mailto:?subject=' + ti + '&body=' + u + '">E-mail</a></li>' +
		'</ul></div></aside></div>' +
		'<p class="cioff-help">Fiche reprise de l’ancien site cioff-france.org. Sur le nouveau site, l’adhérent la complète lui-même (photos, affiche, programmation, lien bénévoles…).</p>' +
		'<p class="cioff-fiche__retour"><a href="annuaire.html">← Retour à l’annuaire</a></p></div>';

	var mini = document.getElementById( 'minicarte' );
	if ( mini ) {
		mini.setAttribute( 'data-minicarte', JSON.stringify( { lat: a.lat, lng: a.lng, zoom: 10, couleur: t.couleur, icone: t.icone, tiles: CIOFF.tiles } ) );
	}
} )();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/annuaire.js"></script>
</body>
</html>
